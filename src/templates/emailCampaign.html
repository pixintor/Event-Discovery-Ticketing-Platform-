<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{title}}</title>
</head>
<body>
  <table border="0" cellpadding="0" cellspacing="0" width="100%">
    <tr>
      <td align="center">
        <!-- Main Container Table -->
        <table border="1" cellpadding="20" cellspacing="0" width="600">
          
          <!-- Header -->
          <tr>
            <td align="center">
              <h1>{{title}}</h1>
            </td>
          </tr>

          <!-- Email Body -->
          <tr>
            <td>
              <p>Hi {{firstName}},</p>
              <p>{{messageBody}}</p>
              
              <!-- Call to Action Link -->
              <p align="center">
                <a href="{{ctaUrl}}" target="_blank"><b>{{ctaText}}</b></a>
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center">
              <p><small>You are receiving this email from {{appName}}.</small></p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
